<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Instagram Signature Sunset/Aurora Gradient -->
    <linearGradient id="instaGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#833ab4" />
      <stop offset="25%" stop-color="#c13584" />
      <stop offset="50%" stop-color="#e1306c" />
      <stop offset="75%" stop-color="#fd1d1d" />
      <stop offset="100%" stop-color="#f77737" />
    </linearGradient>

    <!-- Warm Golden Highlight -->
    <linearGradient id="warmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f77737" />
      <stop offset="50%" stop-color="#fcaf45" />
      <stop offset="100%" stop-color="#ffdc80" />
    </linearGradient>

    <!-- Deep Velvet Radial Background -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#221235" />
      <stop offset="60%" stop-color="#0e0719" />
      <stop offset="100%" stop-color="#06030c" />
    </radialGradient>
  </defs>

  <!-- Outer Squircle with Instagram Story Gradient Ring -->
  <rect x="20" y="20" width="472" height="472" rx="136" fill="url(#bgGrad)" stroke="url(#instaGrad)" stroke-width="24" />

  <!-- Subtle Inner Ring -->
  <rect x="44" y="44" width="424" height="424" rx="116" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2" />

  <!-- Stylized "TO" Monogram & Cyber Shield Badge -->
  <!-- Letter T (Top bar & vertical stem with aerodynamic cyber cuts) -->
  <path d="M 108 160 L 308 160 C 318 160 326 168 326 178 L 326 196 C 326 206 318 214 308 214 L 236 214 L 236 364 C 236 374 228 382 218 382 L 190 382 C 180 382 172 374 172 364 L 172 214 L 108 214 C 98 214 90 206 90 196 L 90 178 C 90 168 98 160 108 160 Z" fill="url(#instaGrad)" />

  <!-- Letter O (Interlocking bold luminous ring) -->
  <circle cx="342" cy="285" r="92" fill="none" stroke="url(#warmGrad)" stroke-width="34" />

  <!-- Cyber Node / Shield Core inside O -->
  <circle cx="342" cy="285" r="28" fill="url(#instaGrad)" />
</svg>
